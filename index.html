<!DOCTYPE html>
<!--
  index.html = the STRUCTURE of the website (what is on the page).
  The look lives in style.css, the logic lives in script.js.

  Built by Claude (AI) for Leon, 24 Nov 2026, from Leon's decisions in docs/product-plan.md:
  the questionnaire "plays one golf hole". The look is design direction D (design/d-chosen.html).

  Layout:
    - Laptop (1024px and wider): the hole fills a sticky panel on the left, the content is on the right.
    - Phone: the hole is a band at the top, the content is below it.
  The hole drawing is shared by all screens; script.js moves the ball and the "camera".
-->

  <!-- Fonts: Cormorant Garamond (headlines), Jost (body text), IBM Plex Mono (small numbers) -->

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
